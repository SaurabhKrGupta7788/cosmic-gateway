<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Hyperparameter Tuning</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700&display=swap" rel="stylesheet">

  <style>
    :root{
      --primary-glow: rgba(159, 121, 255, 0.7);
      --primary-border: rgba(159, 121, 255, 0.4);
      --primary-bg: rgba(23, 13, 48, 0.25);
      --primary-text: #d1c4e9;
    }

    *{ margin:0; padding:0; box-sizing:border-box; }
    html{ scroll-behavior: smooth; }
    body{
      background-color:#00000a;
      color:#ffffff;
      font-family:'Orbitron', sans-serif;
      overflow-x:hidden;
      padding-top:100px;
      padding-bottom:80px;
    }

    #space-canvas{
      position:fixed; top:0; left:0; width:100%; height:100%; z-index:1;
    }

    header{
      position:fixed; top:0; left:0; width:100%;
      display:flex; justify-content:space-between; align-items:center;
      padding:1rem 2.5rem;
      background: rgba(10,5,25,0.8);
      backdrop-filter: blur(8px);
      border-bottom:1px solid rgba(159,121,255,0.2);
      z-index:10;
    }

    .logo{ font-weight:700; font-size:1.5rem; color:var(--primary-text); letter-spacing:2px; }
    nav a{ color:var(--primary-text); text-decoration:none; margin-left:1.5rem; font-size:1rem; transition:all .3s ease; }
    nav a:hover{ color:#fff; text-shadow:0 0 8px #fff; }

    .content-container{
      position:relative; z-index:2; width:100%;
      max-width:1200px; margin:0 auto; padding:2rem; text-align:center;
    }

    h1{
      font-size:clamp(2rem, 6vw, 3rem); margin-bottom:.5rem;
      text-transform:uppercase; letter-spacing:3px;
      background: linear-gradient(90deg, #9f79ff, #c2a8ff, #ffffff);
      -webkit-background-clip:text; -webkit-text-fill-color:transparent;
      text-shadow:0 0 10px rgba(190,168,255,0.5);
    }

    .subtitle{ color:var(--primary-text); font-size:1.1rem; margin-bottom:2rem; }

    .main-layout{ display:flex; flex-direction:column; gap:2rem; }

    .glass-container{
      background:var(--primary-bg); backdrop-filter: blur(8px);
      border:1px solid var(--primary-border); border-radius:15px; padding:2rem;
      box-shadow:0 8px 32px 0 rgba(11,4,26,0.37);
    }

    .tuner-container{ display:grid; grid-template-columns:1fr; gap:2rem; }
    @media (min-width:900px){ .tuner-container{ grid-template-columns:300px 1fr; } }

    .param-sliders{ text-align:left; }
    .param-slider{ margin-bottom:1.5rem; }
    .param-slider label{ display:flex; justify-content:space-between; margin-bottom:.75rem; color:#c2a8ff; font-size:.9rem; text-transform:uppercase; }

    input[type="range"]{ width:100%; -webkit-appearance:none; background:transparent; cursor:pointer; }
    input[type="range"]::-webkit-slider-runnable-track{ height:6px; background: rgba(10,5,30,0.5); border-radius:3px; }
    input[type="range"]::-webkit-slider-thumb{ -webkit-appearance:none; height:18px; width:18px; background:#c2a8ff; border-radius:50%; border:2px solid #fff; margin-top:-6px; box-shadow:0 0 8px var(--primary-glow); }

    #nn-visualization{ width:100%; min-height:350px; background:transparent; display:block; border-radius:12px; }

    .train-btn{
      width:100%; padding:1rem; background:linear-gradient(90deg,#16a085,#1abc9c);
      border:none; border-radius:8px; color:white; font-size:1.1rem; font-family:'Orbitron',sans-serif;
      text-transform:uppercase; cursor:pointer; transition:all .3s ease; border-bottom:3px solid #117a65; margin-top:1.5rem;
    }
    .train-btn:hover{ transform:translateY(-3px); box-shadow:0 10px 20px rgba(22,160,133,0.4); }
    .train-btn:disabled{ background:#555; cursor:not-allowed; transform:none; box-shadow:none; }

    .prediction-section{
      display:none; opacity:0; transition:opacity .5s ease-in-out;
      width: 100%;
    }

    .form-grid{ display:grid; grid-template-columns: repeat(auto-fit, minmax(220px,1fr)); gap:1.5rem; text-align:left; }
    .form-group{ display:flex; flex-direction:column; }
    .form-group label{ color:#c2a8ff; font-size:.9rem; text-transform:uppercase; margin-bottom:.5rem; }
    .form-group input{ padding:.8rem; background: rgba(10,5,30,0.5); border:1px solid rgba(159,121,255,0.5); border-radius:8px; color:#fff; font-size:1rem; font-family:sans-serif; transition:all .3s ease; }
    .form-group input:focus{ outline:none; border-color:#c2a8ff; box-shadow:0 0 10px var(--primary-glow); }

    .predict-btn{ grid-column:1 / -1; width:100%; padding:1rem; background: linear-gradient(90deg,#8e44ad,#9b59b6); border:none; border-radius:8px; color:white; font-size:1.1rem; font-family:'Orbitron',sans-serif; text-transform:uppercase; cursor:pointer; transition:all .3s ease; margin-top:1rem; border-bottom:3px solid #6c3383; }
    .predict-btn:hover{ transform:translateY(-3px); box-shadow:0 10px 20px rgba(155,89,182,0.4); }

    .result-container{
      margin-top:2rem; 
      padding:0; /* Remove padding to let inner content control spacing */
      background: transparent; /* Remove background to let inner containers handle it */
      border: none; /* Remove border */
      border-radius:0; 
      text-align:center; 
      min-height:auto; /* Remove fixed height */
      display:block; /* Change from flex to block */
      font-family:sans-serif; 
      transition:opacity .5s ease;
      width: 100%;
    }

    footer{
      position:fixed; bottom:0; left:0; width:100%; text-align:center; padding:1rem;
      background: rgba(10,5,25,0.8); backdrop-filter: blur(8px); border-top:1px solid rgba(159,121,255,0.2); font-size:.9rem; color:#aaa; z-index:10;
    }

    /* Responsive tweaks for canvases and layout */
    @media (max-width:899px){
      #nn-visualization{ min-height:300px; }
    }

    /* NEW: Container for results and prediction form (initially hidden) */
    #after-training-section {
        display: none;
        border-top: 1px solid var(--primary-border);
        padding-top: 2.5rem;
    }

    /* NEW: Two-column layout for results and form */
    .results-and-prediction-layout {
        display: grid;
        grid-template-columns: 1fr;
        gap: 2.5rem;
        align-items: flex-start;
    }

    @media (min-width: 1200px) {
        .results-and-prediction-layout { grid-template-columns: 350px 1fr; }
    }
    
    .result-card h2 {
        font-family: 'Orbitron', sans-serif; font-size: 1.5rem; text-align: left; margin-bottom: 1.5rem;
        background: none; -webkit-background-clip: unset; -webkit-text-fill-color: unset;
        color: #fff; text-shadow: none;
    }
    .result-card p { color: var(--body-text); margin-bottom: 0.5rem; font-size: 1rem; text-align: left; }
    .result-card strong { color: #e0e0ff; font-weight: 400; }
    .plot-image { width: 100%; border-radius: 10px; margin-top: 1rem; border: 1px solid var(--primary-border); }
    .session-info { margin-top: 1rem; padding-top: 1rem; border-top: 1px solid var(--primary-border); color: #a29bfe; font-family: 'Courier New', Courier, monospace; font-size: 0.9rem; text-align: left; }
    
    .form-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 1.5rem; text-align: left; }
    .form-group label { color: #c2a8ff; font-size: .9rem; text-transform: uppercase; margin-bottom: .5rem; }
    .form-group input { padding: .8rem; background: rgba(10, 5, 30, 0.5); border: 1px solid rgba(159, 121, 255, 0.5); border-radius: 8px; color: #fff; font-size: 1rem; transition: all .3s ease; }
    .form-group input:focus { outline: none; border-color: #c2a8ff; box-shadow: 0 0 10px var(--primary-glow); }
    .predict-btn { grid-column: 1 / -1; width: 100%; padding: 1rem; background: linear-gradient(90deg, #8e44ad, #9b59b6); border: none; border-radius: 8px; color: white; font-size: 1.1rem; font-family: 'Orbitron', sans-serif; text-transform: uppercase; cursor: pointer; transition: all .3s ease; margin-top: 1rem; border-bottom: 3px solid #6c3383; }
    .predict-btn:hover { transform: translateY(-3px); box-shadow: 0 10px 20px rgba(155, 89, 182, 0.4); }

    footer {
        position: fixed; bottom: 0; left: 0; width: 100%; text-align: center; padding: 1rem;
        background: rgba(10, 5, 25, 0.8); backdrop-filter: blur(8px); border-top: 1px solid rgba(159, 121, 255, 0.2); font-size: .9rem; color: #aaa; z-index: 10;
    }

    /* NEW: Improved training results layout */
    .training-results-container {
        display: grid;
        grid-template-columns: 1fr;
        gap: 2rem;
        margin-top: 0;
        width: 100%;
    }
    
    @media (min-width: 900px) {
        .training-results-container {
            grid-template-columns: 1fr 1fr;
            align-items: start;
        }
    }
    
    .training-stats {
        background: rgba(10, 5, 30, 0.7);
        border: 1px solid var(--primary-border);
        border-radius: 15px;
        padding: 1.5rem;
        text-align: left;
        width: 100%;
    }
    
    .training-stats h3 {
        font-family: 'Orbitron', sans-serif;
        font-size: 1.3rem;
        margin-bottom: 1.5rem;
        color: #fff;
        text-align: center;
        border-bottom: 1px solid var(--primary-border);
        padding-bottom: 0.75rem;
    }
    
    .stat-item {
        display: flex;
        justify-content: space-between;
        margin-bottom: 1rem;
        padding-bottom: 0.75rem;
        border-bottom: 1px solid rgba(159, 121, 255, 0.2);
    }
    
    .stat-label {
        color: #c2a8ff;
        font-weight: 400;
    }
    
    .stat-value {
        color: #fff;
        font-weight: 700;
        text-shadow: 0 0 5px rgba(159, 121, 255, 0.7);
    }
    
    .accuracy-highlight {
        background: linear-gradient(90deg, rgba(22, 160, 133, 0.2), rgba(26, 188, 156, 0.2));
        border-radius: 8px;
        padding: 1rem;
        margin-top: 1rem;
        text-align: center;
        border: 1px solid rgba(22, 160, 133, 0.4);
    }
    
    .accuracy-highlight .stat-value {
        font-size: 1.5rem;
        color: #1abc9c;
    }
    
    .training-plot {
        background: rgba(10, 5, 30, 0.7);
        border: 1px solid var(--primary-border);
        border-radius: 15px;
        padding: 1.5rem;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        width: 100%;
    }
    
    .training-plot h3 {
        font-family: 'Orbitron', sans-serif;
        font-size: 1.3rem;
        margin-bottom: 1rem;
        color: #fff;
        text-align: center;
    }
    
    .plot-image {
        width   : 800px;
        max-width: 750px;
        border-radius: 10px;
        border: 1px solid var(--primary-border);
    }
    
    .session-info {
        margin-top: 1.5rem;
        padding-top: 1rem;
        border-top: 1px solid var(--primary-border);
        color: #a29bfe;
        font-family: 'Courier New', Courier, monospace;
        font-size: 0.9rem;
        text-align: left;
    }

    /* Fix for initial result text */
    #resultText {
        color: var(--primary-text);
        font-style: italic;
    }
  </style>
</head>
<body>
  <header>
    <div class="logo">COSMIC GW</div>
    <nav>
      <a href="{% url 'main' %}">Home</a>
      <a href="{% url 'k2' %}">Model Prediction</a>
      <a href="{% url 'how_it_works' %}">How It Works</a>
      <a href="{% url 'about' %}">About</a>
    </nav>
  </header>

  <canvas id="space-canvas" aria-hidden="true"></canvas>

  <main class="content-container">
    <h1>Model Customization</h1>
    <p class="subtitle">Tune hyperparameters to build your own prediction model</p>

    <div class="main-layout">
      <div class="glass-container">
        <div class="tuner-container">
          <div class="param-sliders">
            <h2>Hyperparameters</h2>
            <form id="tuningForm" action="{% url 'tune_model' %}" method="post">
              {% csrf_token %}

              <!-- Hidden fields posted to backend -->
              <input type="hidden" name="n_hidden_layer" id="hidden_layers" value="1">
              <input type="hidden" name="num_neurons" id="hidden_neurons" value="16">
              <input type="hidden" name="d_rate" id="hidden_dropout" value="0.0">
              <input type="hidden" name="learning_rate" id="hidden_lr" value="0.0001">

              <div class="param-slider">
                <label><span>Hidden Layers</span><span id="layers-value">1</span></label>
                <input type="range" id="layers" min="1" max="5" value="1">
              </div>

              <div class="param-slider">
                <label><span>Neurons per Layer</span><span id="neurons-value">16</span></label>
                <input type="range" id="neurons" min="16" max="128" step="16" value="16">
              </div>

              <div class="param-slider">
                <label><span>Dropout</span><span id="dropout-value">0%</span></label>
                <input type="range" id="dropout" min="0" max="90" step="10" value="0">
              </div>

              <div class="param-slider">
                <label><span>Learning Rate</span><span id="lr-value">0.0001</span></label>
                <input type="range" id="lr" min="1" max="100" value="1">
              </div>

              <button type="submit" id="train-btn" class="train-btn">Train Model</button>
            </form>

            <div id="result-container" class="result-container" aria-live="polite">
              <p id="resultText">Transmission log will appear here...</p>
            </div>
          </div>

          <div>
            <canvas id="nn-visualization" role="img" aria-label="Neural network visualization"></canvas>
          </div>
        </div>
      </div>

      <div class="prediction-section" id="prediction-section">
        <div class="glass-container">
          <h2>Make Predictions</h2>
          <form id="cosmicForm" action="{% url 'predict_koi_train' %}" method="post">
            {% csrf_token %}
            <div class="form-grid">
              <div class="form-group">
                <label for="koi_period">KOI Period</label>
                <input type="number" step="any" id="koi_period" name="koi_period" required>
              </div>
              <div class="form-group">
                <label for="koi_impact">KOI Impact</label>
                <input type="number" step="any" id="koi_impact" name="koi_impact" required>
              </div>
              <div class="form-group">
                <label for="koi_duration">KOI Duration</label>
                <input type="number" step="any" id="koi_duration" name="koi_duration" required>
              </div>
              <div class="form-group">
                <label for="koi_depth">KOI Depth</label>
                <input type="number" step="any" id="koi_depth" name="koi_depth" required>
              </div>

              <div class="form-group">
                <label for="koi_prad">KOI PRAD</label>
                <input type="number" step="any" id="koi_prad" name="koi_prad" required>
              </div>
              <div class="form-group">
                <label for="koi_sma">KOI SMA</label>
                <input type="number" step="any" id="koi_sma" name="koi_sma" required>
              </div>

              <div class="form-group">
                <label for="koi_teq">KOI TEQ</label>
                <input type="number" step="any" id="koi_teq" name="koi_teq" required>
              </div>
              <div class="form-group">
                <label for="koi_insol">KOI Insol</label>
                <input type="number" step="any" id="koi_insol" name="koi_insol" required>
              </div>

              <div class="form-group">
                <label for="koi_model_snr">KOI Model SNR</label>
                <input type="number" step="any" id="koi_model_snr" name="koi_model_snr" required>
              </div>
              <div class="form-group">
                <label for="koi_steff">KOI Steff</label>
                <input type="number" step="any" id="koi_steff" name="koi_steff" required>
              </div>

              <div class="form-group">
                <label for="koi_slogg">KOI Slogg</label>
                <input type="number" step="any" id="koi_slogg" name="koi_slogg" required>
              </div>
              <div class="form-group">
                <label for="koi_srad">KOI Srad</label>
                <input type="number" step="any" id="koi_srad" name="koi_srad" required>
              </div>

              <div class="form-group">
                <label for="koi_kepmag">KOI Kepmag</label>
                <input type="number" step="any" id="koi_kepmag" name="koi_kepmag" required>
              </div>

              <button type="submit" class="predict-btn">Transmit KOI Data</button>
            </div>
          </form>
        </div>
      </div>
    </div>
  </main>

  <footer>
    <p>&copy; 2025 Cosmic Gateway. All Rights Reserved.</p>
  </footer>

  <script>
    /* ------------------------------------------------
       Space visualization
       ------------------------------------------------*/
    const spaceCanvas = document.getElementById('space-canvas');
    const s_ctx = spaceCanvas.getContext('2d');
    let width, height;
    let stars = [], comets = [], milkyWayStars = [];
    const starCount = 400, milkyWayStarCount = 2500;
    const mouse = { x: null, y: null };

    function randomGaussian(mean, stdDev) {
      let u1, u2, w;
      do {
        u1 = 2 * Math.random() - 1;
        u2 = 2 * Math.random() - 1;
        w = u1 * u1 + u2 * u2;
      } while (w >= 1 || w === 0);
      w = Math.sqrt((-2 * Math.log(w)) / w);
      return mean + stdDev * u1 * w;
    }

    function initSpace() {
      width = window.innerWidth;
      height = window.innerHeight;
      spaceCanvas.width = width;
      spaceCanvas.height = height;
      mouse.x = width / 2;
      mouse.y = height / 2;
      stars = [];
      for (let i = 0; i < starCount; i++) {
        stars.push({
          x: Math.random() * width,
          y: Math.random() * height,
          size: Math.random() * 1.5 + 0.5,
          speed: Math.random() * 0.4 + 0.1,
          alpha: Math.random() * 0.5 + 0.5,
          alphaDirection: 1,
          twinkleSpeed: Math.random() * 0.015
        });
      }

      milkyWayStars = [];
      for (let i = 0; i < milkyWayStarCount; i++) {
        const angle = Math.random() * Math.PI * 2;
        const radius = randomGaussian(0, width * 0.3);
        const x = width / 2 + Math.cos(angle) * radius;
        const y = height / 2 + Math.sin(angle) * radius * 0.2 + randomGaussian(0, 30);
        milkyWayStars.push({
          x: x,
          y: y,
          size: Math.random() * 0.8,
          alpha: Math.random() * 0.3 + 0.05,
          alphaDirection: 1,
          twinkleSpeed: Math.random() * 0.01
        });
      }

      comets = [];
    }

    function Comet() {
      this.x = Math.random() * width;
      this.y = -50;
      this.speed = Math.random() * 3 + 2;
      this.size = Math.random() * 2 + 1;
      this.length = Math.random() * 100 + 50;
    }

    function drawComets() {
      for (let i = 0; i < comets.length; i++) {
        const comet = comets[i];
        // Use comet.length (not this.length)
        const gradient = s_ctx.createLinearGradient(comet.x, comet.y, comet.x - comet.length / 4, comet.y - comet.length);
        gradient.addColorStop(0, 'rgba(255,255,255,0.5)');
        gradient.addColorStop(1, 'rgba(255,255,255,0)');
        s_ctx.fillStyle = gradient;
        s_ctx.beginPath();
        s_ctx.arc(comet.x, comet.y, comet.size, 0, Math.PI * 2);
        s_ctx.fill();

        // tail
        s_ctx.beginPath();
        s_ctx.moveTo(comet.x, comet.y);
        s_ctx.lineTo(comet.x - comet.length / 2, comet.y - comet.length);
        s_ctx.strokeStyle = 'rgba(255,255,255,0.06)';
        s_ctx.lineWidth = comet.size;
        s_ctx.stroke();

        comet.y += comet.speed;
        comet.x -= comet.speed / 4;
        if (comet.y > height + 50) {
          comets.splice(i, 1);
          i--;
        }
      }
    }

    function animateSpace() {
      s_ctx.clearRect(0, 0, width, height);
      const gradient = s_ctx.createRadialGradient(width / 2, height / 2, 0, width / 2, height / 2, Math.max(width, height));
      gradient.addColorStop(0, 'rgba(15,5,40,0.1)');
      gradient.addColorStop(1, 'rgba(0,0,10,0.5)');
      s_ctx.fillStyle = gradient;
      s_ctx.fillRect(0, 0, width, height);

      const parallaxX = (mouse.x - width / 2) * 0.005;
      const parallaxY = (mouse.y - height / 2) * 0.005;

      // milky way band
      s_ctx.save();
      s_ctx.translate(parallaxX * 0.2, parallaxY * 0.2);
      s_ctx.rotate(0.2);
      for (const star of milkyWayStars) {
        if (star.alpha > 0.4 || star.alpha < 0.05) { star.alphaDirection *= -1; }
        star.alpha += star.twinkleSpeed * star.alphaDirection;
        s_ctx.globalAlpha = star.alpha;
        s_ctx.fillStyle = 'white';
        s_ctx.beginPath();
        s_ctx.arc(star.x, star.y, star.size, 0, Math.PI * 2);
        s_ctx.fill();
      }
      s_ctx.restore();

      for (const star of stars) {
        star.y -= star.speed;
        if (star.y < 0) { star.y = height; star.x = Math.random() * width; }
        if (star.alpha > 1 || star.alpha < 0.1) { star.alphaDirection *= -1; }
        star.alpha += star.twinkleSpeed * star.alphaDirection;

        s_ctx.save();
        s_ctx.globalAlpha = star.alpha;
        s_ctx.fillStyle = 'white';
        s_ctx.beginPath();
        s_ctx.arc(star.x + parallaxX * star.size, star.y + parallaxY * star.size, star.size, 0, Math.PI * 2);
        s_ctx.fill();
        s_ctx.restore();
      }

      if (Math.random() < 0.005) { comets.push(new Comet()); }
      drawComets();
      requestAnimationFrame(animateSpace);
    }

    window.addEventListener('resize', () => { initSpace(); });
    window.addEventListener('mousemove', e => { mouse.x = e.clientX; mouse.y = e.clientY; });
    initSpace();
    animateSpace();

    /* ------------------------------------------------
       Neural network visualization
       ------------------------------------------------*/
    const nnCanvas = document.getElementById('nn-visualization');
    const nnCtx = nnCanvas.getContext('2d');

    const layersSlider = document.getElementById('layers');
    const neuronsSlider = document.getElementById('neurons');

    // Network data structure
    let networkStructure = { layers: [], connections: [] };

    function setupNNCanvas() {
      // Set canvas size to element size (high-DPI aware)
      const rect = nnCanvas.getBoundingClientRect();
      const dpr = window.devicePixelRatio || 1;
      nnCanvas.width = Math.max(rect.width * dpr, 300);
      nnCanvas.height = Math.max(rect.height * dpr, 300);
      nnCanvas.style.width = rect.width + "px";
      nnCanvas.style.height = rect.height + "px";
      nnCtx.setTransform(dpr, 0, 0, dpr, 0, 0);

      buildNetworkStructure();
    }

    function buildNetworkStructure() {
      networkStructure = { layers: [], connections: [] };

      const layers = parseInt(layersSlider.value, 10);
      const neurons = parseInt(neuronsSlider.value, 10);

      const w = nnCanvas.width / (window.devicePixelRatio || 1);
      const h = nnCanvas.height / (window.devicePixelRatio || 1);

      if (w === 0 || h === 0) return;

      const layerX = (i) => w / (layers + 2) * (i + 1);
      const neuronY = (j, count) => h / (count + 1) * (j + 1);

      let prevPositions = [];

      // Input layer (3 nodes)
      for (let i = 0; i <= layers + 1; i++) {
        const isInput = i === 0;
        const isOutput = i === layers + 1;
        let currentCount = neurons;
        if (isInput) currentCount = 3;
        if (isOutput) currentCount = 2;

        const currentLayer = [];
        const currentPositions = [];

        for (let j = 0; j < currentCount; j++) {
          const x = layerX(i);
          const y = neuronY(j, currentCount);
          const radius = isInput || isOutput ? 6 : Math.max(4, neurons / 22);
          currentLayer.push({ x, y, radius, layerIndex: i, neuronIndex: j });
          currentPositions.push({ x, y });
          if (i > 0) {
            for (let k = 0; k < prevPositions.length; k++) {
              networkStructure.connections.push({ from: prevPositions[k], to: { x, y } });
            }
          }
        }

        networkStructure.layers.push(currentLayer);
        prevPositions = currentPositions;
      }
    }

    function animateNN(timestamp) {
      const w = nnCanvas.width / (window.devicePixelRatio || 1);
      const h = nnCanvas.height / (window.devicePixelRatio || 1);
      nnCtx.clearRect(0, 0, w, h);
      const time = timestamp * 0.001;

      // draw connections
      nnCtx.lineWidth = 1;
      networkStructure.connections.forEach((conn, index) => {
        const shimmer = Math.sin(time * 3 + index * 0.2) * 0.25 + 0.25;
        nnCtx.strokeStyle = `rgba(159,121,255,${shimmer})`;
        nnCtx.beginPath();
        nnCtx.moveTo(conn.from.x, conn.from.y);
        nnCtx.lineTo(conn.to.x, conn.to.y);
        nnCtx.stroke();
      });

      // draw neurons
      networkStructure.layers.forEach((layer, layerIndex) => {
        layer.forEach((neuron, neuronIndex) => {
          const pulse = Math.sin(time * 4 + layerIndex - neuronIndex) * 0.5 + 0.5;
          const radius = neuron.radius + pulse * 1.5;

          const glow = nnCtx.createRadialGradient(neuron.x, neuron.y, 0, neuron.x, neuron.y, radius * 2);
          glow.addColorStop(0, 'rgba(210,180,255,0.8)');
          glow.addColorStop(0.5, 'rgba(190,150,255,0.4)');
          glow.addColorStop(1, 'rgba(159,121,255,0)');

          nnCtx.fillStyle = glow;
          nnCtx.beginPath();
          nnCtx.arc(neuron.x, neuron.y, radius, 0, Math.PI * 2);
          nnCtx.fill();
        });
      });

      requestAnimationFrame(animateNN);
    }

    window.addEventListener('resize', () => {
      // small delay so layout settles
      clearTimeout(window._nnResizeTimeout);
      window._nnResizeTimeout = setTimeout(() => {
        setupNNCanvas();
      }, 120);
    });

    // wire slider updates to structure rebuild
    [layersSlider, neuronsSlider].forEach(s => {
      s.addEventListener('input', () => {
        document.getElementById('layers-value').textContent = layersSlider.value;
        document.getElementById('neurons-value').textContent = neuronsSlider.value;
        document.getElementById('hidden_layers').value = layersSlider.value;
        document.getElementById('hidden_neurons').value = neuronsSlider.value;
        buildNetworkStructure();
      });
    });

    // initial setup
    window.addEventListener('load', () => {
      // ensure canvas element has a reasonable CSS height
      if (!nnCanvas.style.height) nnCanvas.style.height = '380px';
      setupNNCanvas();
      requestAnimationFrame(animateNN);
    });

    /* ------------------------------------------------
       Hyperparameter form logic and training flow
       ------------------------------------------------*/
    const tuningForm = document.getElementById('tuningForm');
    const dropoutSlider = document.getElementById('dropout');
    const lrSlider = document.getElementById('lr');

    const hiddenLayers = document.getElementById('hidden_layers');
    const hiddenNeurons = document.getElementById('hidden_neurons');
    const hiddenDropout = document.getElementById('hidden_dropout');
    const hiddenLR = document.getElementById('hidden_lr');

    const layersValue = document.getElementById('layers-value');
    const neuronsValue = document.getElementById('neurons-value');
    const dropoutValue = document.getElementById('dropout-value');
    const lrValue = document.getElementById('lr-value');

    // update display & hidden inputs for dropout & learning rate
    dropoutSlider.addEventListener('input', (e) => {
      dropoutValue.textContent = `${e.target.value}%`;
      hiddenDropout.value = (e.target.value / 100).toFixed(2);
    });

    lrSlider.addEventListener('input', (e) => {
      // UI shows 0.0001 .. 0.01 roughly (1..100 mapped /10000)
      const value = parseFloat(e.target.value) / 10000;
      lrValue.textContent = value.toFixed(4);
      hiddenLR.value = value.toFixed(6);
    });

    // ensure displayed initial values are correct (in case DOM changed)
    layersValue.textContent = layersSlider.value;
    neuronsValue.textContent = neuronsSlider.value;
    dropoutValue.textContent = `${dropoutSlider.value}%`;
    (function initLRValue(){
      const value = parseFloat(lrSlider.value) / 10000;
      lrValue.textContent = value.toFixed(4);
      hiddenLR.value = value.toFixed(6);
    })();

    const trainBtn = document.getElementById('train-btn');
    const predictionSection = document.getElementById('prediction-section');
    const resultContainer = document.getElementById('result-container');
    const resultText = document.getElementById('resultText');

    tuningForm.addEventListener('submit', (e) => {
      e.preventDefault();

      // simple safety: ensure hidden inputs are synced
      hiddenLayers.value = layersSlider.value;
      hiddenNeurons.value = neuronsSlider.value;
      hiddenDropout.value = (dropoutSlider.value / 100).toFixed(2);
      hiddenLR.value = (parseFloat(lrSlider.value) / 10000).toFixed(6);

      trainBtn.disabled = true;
      trainBtn.textContent = "TRAINING IN PROGRESS...";
      resultText.textContent = "Transmitting parameters to the training module... Stand by.";

      const formData = new FormData(tuningForm);

      // Fetch the backend (Django view). The view will also set session keys server-side.
      fetch(tuningForm.action, {
        method: 'POST',
        body: formData,
        headers: {
          // We include CSRF token via header as well; Django expects CSRF token either in header or cookie.
          'X-CSRFToken': formData.get('csrfmiddlewaretoken')
        }
      })
      .then(async (response) => {
        // Always attempt to parse JSON even if non-200 to get backend error message
        const data = await response.json().catch(() => null);
        if (!response.ok) {
          const msg = (data && data.message) ? data.message : `Server returned ${response.status}`;
          throw new Error(msg);
        }
        return data;
      })
      .then((data) => {
        if (data.status === 'success') {
          // Build result HTML using returned results and plot
          const resultsHTML = `
            <div class="training-results-container">
              <div class="training-stats">
                <h3>Training Results</h3>
                <div class="stat-item">
                  <span class="stat-label">Hidden Layers:</span>
                  <span class="stat-value">${data.results.n_hidden_layer}</span>
                </div>
                <div class="stat-item">
                  <span class="stat-label">Neurons per Layer:</span>
                  <span class="stat-value">${data.results.num_neurons}</span>
                </div>
                <div class="stat-item">
                  <span class="stat-label">Dropout Rate:</span>
                  <span class="stat-value">${(data.results.d_rate * 100).toFixed(0)}%</span>
                </div>
                <div class="stat-item">
                  <span class="stat-label">Learning Rate:</span>
                  <span class="stat-value">${data.results.learning_rate}</span>
                </div>
                <div class="stat-item">
                  <span class="stat-label">Training Epochs:</span>
                  <span class="stat-value">${data.results.last_epoch}</span>
                </div>
                <div class="accuracy-highlight">
                  <div class="stat-item">
                    <span class="stat-label">Final Test Accuracy:</span>
                    <span class="stat-value">${data.results.final_accuracy}%</span>
                  </div>
                  <div class="stat-item">
                    <span class="stat-label">Best Accuracy:</span>
                    <span class="stat-value">${data.results.best_accuracy}%</span>
                  </div>
                </div>
                <div class="session-info">
                  <p><strong>Model saved to session:</strong> tuned_model_state_b64 and tuned_model_params</p>
                  <p>You can now use the trained model for predictions in this session.</p>
                </div>
              </div>
              <div class="training-plot">
                <h3>Training Progress</h3>
                ${data.plot_url ? `<img src="data:image/png;base64,${data.plot_url}" alt="Training Accuracy Plot" class="plot-image">` : '<p>No plot available</p>'}
              </div>
            </div>
          `;
          resultContainer.innerHTML = resultsHTML;

          // show prediction section (server stored the model in session; now UI shows prediction form)
          predictionSection.style.display = 'block';
          setTimeout(() => predictionSection.style.opacity = 1, 50);
        } else {
          // backend reported status!=success
          const msg = data && data.message ? data.message : 'Unknown server response';
          resultText.textContent = `Error: ${msg}`;
        }
      })
      .catch((error) => {
        console.error('Error:', error);
        resultText.textContent = 'A network error occurred. Could not complete training: ' + error.message;
      })
      .finally(() => {
        trainBtn.disabled = false;
        trainBtn.textContent = "Train Model";
      });
    });

    /* ------------------------------------------------
       Notes about session usage:
       - The Django view (tune_model_view) encodes the trained model into
         request.session['tuned_model_state_b64'] and request.session['tuned_model_params'].
       - The UI receives the training summary and plot through JSON here and updates the page.
       - If you want to fetch server-side session values later (for example to show more metadata),
         implement a dedicated endpoint that returns them (e.g. GET /session_info/) and query it from JS.
       ------------------------------------------------*/
  </script>
</body>
</html>
